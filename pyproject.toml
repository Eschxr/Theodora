[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=3.0"]
build-backend = "scikit_build_core.build"

[project]
name = "theodora"
version = "0.1.0"
description = "Pytorch-esque deep learning library"
requires-python = ">=3.10"

[tool.scikit-build]
wheel.packages = ["python/theodora"]
build-dir = "build/{wheel_tag}"
